name: Daily Viral Clip Sync

on:
  schedule:
    - cron: '0 12 * * *' # Runs automatically every day at 8:00 AM EST
  workflow_dispatch: # Allows you to run it manually with a button click

jobs:
  sync-clips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          pip install requests

      - name: Run Ingestion Script
        run: |
          python scripts/fetch_clips.py

      - name: Deploy Database Changes to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy data --project-name=stfrcm
